services:
  app-dev:
    build:
      context: .
      dockerfile: ./Dockerfile.dev
    env_file:
      - ./.env
    networks:
      - external-dev
      - internal-dev
    ports:
      - ${APP_PORT}:80
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

  db:
    build:
      context: ./docker/mysql
      dockerfile: ./Dockerfile
    env_file:
      - ./.env
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD}
      - MYSQL_DATABASE=${DB_DATABASE}
    networks:
      - internal-dev
    ports:
      - 3306:3306
    restart: unless-stopped
    volumes:
      - ./db-data/dev/data:/var/lib/mysql
      - ./db-data/dev/logs:/var/lib/mysql-bin
    healthcheck:
      test: [ "CMD", "mysqladmin" ,"ping", "-h", "localhost" ]
      timeout: 20s
      retries: 10

volumes:
  db-data:
    external: true

networks:
  external-dev:
    internal: false

  internal-dev:
    internal: true
